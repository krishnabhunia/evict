name: Build Evict

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional Authenticode signing – both steps below are skipped while these secrets are empty.
      # SIGN_PFX_BASE64: base64 of a .pfx code-signing certificate, SIGN_PFX_PASSWORD: its password.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Restore
        run: dotnet restore Evict.sln

      - name: Unit tests
        run: dotnet test tests/Evict.Core.Tests/Evict.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx"

      - name: XAML sanity checks
        env:
          PYTHONUTF8: "1"
        run: python build/xaml_check.py

      - name: Publish single-file EXE
        run: dotnet publish src/Evict.App/Evict.App.csproj -c Release -o publish

      - name: Sign Evict.exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 publish\Evict.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\publish" installer\Evict.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer\Output

      - name: Sign installer (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem installer\Output\*.exe | ForEach-Object { & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash publish/Evict.exe -Algorithm SHA256).Hash | Out-File publish/Evict.exe.sha256 -Encoding ascii
          Get-ChildItem installer\Output\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evict-${{ steps.ver.outputs.version }}-${{ github.sha }}
          path: |
            publish/Evict.exe
            publish/Evict.exe.sha256
            installer/Output/*.exe
            installer/Output/*.sha256

      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Evict.exe
            publish/Evict.exe.sha256
            installer/Output/*.exe
            installer/Output/*.sha256
          generate_release_notes: true
